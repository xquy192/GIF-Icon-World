name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: gif-icon-world-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
