name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Validate language files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("src/main/resources/assets/gif_icon_world/lang")
          files = sorted(folder.glob("*.json"))
          if not files:
              raise SystemExit("No language files found")

          reference = json.loads((folder / "en_us.json").read_text(encoding="utf-8"))
          expected = set(reference)
          for path in files:
              entries = json.loads(path.read_text(encoding="utf-8"))
              if set(entries) != expected:
                  raise SystemExit(f"{path.name}: translation keys do not match en_us.json")
              if not all(isinstance(value, str) for value in entries.values()):
                  raise SystemExit(f"{path.name}: translation values must be strings")

          print(f"Validated {len(files)} language files with {len(expected)} keys each")
          PY
      - name: Verify the icon inside the mod JAR
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import struct
          import zipfile
          import zlib

          jars = [p for p in glob.glob("build/libs/*.jar") if not p.endswith("-sources.jar")]
          if len(jars) != 1:
              raise SystemExit(f"Expected one mod JAR, found {len(jars)}")

          with zipfile.ZipFile(jars[0]) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              icon_path = metadata.get("icon")
              if not icon_path or icon_path not in archive.namelist():
                  raise SystemExit(f"Icon declared in fabric.mod.json is missing: {icon_path!r}")
              png = archive.read(icon_path)

          if not png.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10])) or len(png) < 45:
              raise SystemExit("The mod icon is not a complete PNG file")

          width, height = struct.unpack(">II", png[16:24])
          if width != height or width < 1:
              raise SystemExit(f"Mod icon must be square, got {width}x{height}")

          offset = 8
          saw_iend = False
          while offset < len(png):
              if offset + 12 > len(png):
                  raise SystemExit("Truncated PNG chunk header")
              length = struct.unpack(">I", png[offset:offset + 4])[0]
              chunk_type = png[offset + 4:offset + 8]
              chunk_end = offset + 8 + length
              if chunk_end + 4 > len(png):
                  raise SystemExit(f"Truncated PNG chunk: {chunk_type!r}")
              expected_crc = struct.unpack(">I", png[chunk_end:chunk_end + 4])[0]
              actual_crc = zlib.crc32(png[offset + 4:chunk_end]) & 0xffffffff
              if actual_crc != expected_crc:
                  raise SystemExit(f"PNG checksum failed for chunk {chunk_type!r}")
              offset = chunk_end + 4
              if chunk_type == b"IEND":
                  saw_iend = True
                  break

          if not saw_iend or offset != len(png):
              raise SystemExit("PNG end marker is missing or has trailing bytes")

          print(f"Verified mod icon: {icon_path} ({width}x{height}, {len(png)} bytes)")
          PY
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: gif-icon-world-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  windows-build-helper:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Rename and move the build helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build helper test" | Out-Null
          Move-Item -LiteralPath "build.bat" -Destination "build helper test/run builder.bat"
      - name: Run the build helper from its new location
        shell: pwsh
        run: |
          cmd.exe /d /c 'call "build helper test\run builder.bat" --worker'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
